name: Phase 4 X Search Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/phase4-x-search-cleanup.js'
      - '.github/workflows/phase4-x-search-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate cleanup script
        run: node --check scripts/phase4-x-search-cleanup.js

      - name: Apply Phase 4 cleanup
        run: node scripts/phase4-x-search-cleanup.js

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' \
            -not -path './.git/*' \
            -not -path './backup/*' \
            -print0)

      - name: Deterministic tests
        run: node --test tests/*.test.js

      - name: Verify X-search ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QuickLinksRedsXSearchCore' sidepanel.js
          grep -q 'Core.buildXSearchUrl' sidepanel.js
          ! grep -q 'buildRedsXUrlSidepanel = buildXSearchUrl' reds-x-search-polish.js
          ! grep -q 'runRedsXSearchSidepanel = runXSearch' reds-x-search-polish.js
          ! grep -q 'stopImmediatePropagation()' reds-x-search-polish.js

      - name: Commit cleanup and remove one-shot automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/phase4-x-search-cleanup.js .github/workflows/phase4-x-search-cleanup.yml
          rmdir scripts 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: move effective X search ownership into sidepanel'
          git push origin HEAD:main
