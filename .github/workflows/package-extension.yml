name: Package extension ZIP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './backup/*' -not -path './dist/*' -print0)

      - name: Run deterministic behavior tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.js

      - name: Read extension version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          package_dir="dist/quicklinksexpansion"
          mkdir -p "$package_dir"

          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'backup/' \
            --exclude 'dist/' \
            --exclude 'tests/' \
            --exclude 'icons/Gemini_Generated_Image_*.png' \
            ./ "$package_dir/"

          cd dist
          zip -qr "quicklinksexpansion-v${version}.zip" quicklinksexpansion

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: quicklinksexpansion-v${{ steps.version.outputs.version }}
          path: dist/quicklinksexpansion-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
