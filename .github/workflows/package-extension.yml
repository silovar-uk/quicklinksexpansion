name: Package extension ZIP

on:
  push:
    branches: [main]
    paths-ignore:
      - 'release/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './backup/*' -not -path './dist/*' -not -path './release/*' -print0)

      - name: Validate manifest file references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const refs = [
            manifest.background?.service_worker,
            manifest.side_panel?.default_path,
            ...Object.values(manifest.icons || {}),
            ...Object.values(manifest.action?.default_icon || {}),
            ...(manifest.content_scripts || []).flatMap(entry => entry.js || [])
          ].filter(Boolean);
          const missing = [...new Set(refs)].filter(file => !fs.existsSync(file));
          if (missing.length) {
            console.error('Missing manifest references:\n' + missing.join('\n'));
            process.exit(1);
          }
          console.log(`Validated ${new Set(refs).size} manifest file references.`);
          NODE

      - name: Run deterministic behavior tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.js

      - name: Read extension version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build installable runtime-only ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          package_dir="dist/package-root"
          zip_path="dist/quicklinksexpansion-v${version}.zip"
          mkdir -p "$package_dir"

          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'backup/' \
            --exclude 'dist/' \
            --exclude 'release/' \
            --exclude 'tests/' \
            --exclude '*.md' \
            --exclude 'VALIDATION_RESULTS.json' \
            --exclude 'icons/Gemini_Generated_Image_*.png' \
            ./ "$package_dir/"

          (
            cd "$package_dir"
            zip -qr "../quicklinksexpansion-v${version}.zip" .
          )

          test -f "$zip_path"

      - name: Verify packaged runtime contract
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          zip_path="dist/quicklinksexpansion-v${version}.zip"
          verify_dir="dist/verify-package"
          entries="$(unzip -Z1 "$zip_path")"

          if ! grep -Fxq 'manifest.json' <<< "$entries"; then
            echo 'manifest.json is not at ZIP root.' >&2
            exit 1
          fi

          if grep -Eq '^quicklinksexpansion/' <<< "$entries"; then
            echo 'Unexpected quicklinksexpansion/ parent directory exists in ZIP.' >&2
            exit 1
          fi

          if grep -Eq '\.md$' <<< "$entries"; then
            echo 'Development Markdown files must not ship in the extension ZIP.' >&2
            exit 1
          fi

          for required in app-contract.js interaction-core.js interaction-bridge.js side-panel-presence-background.js ui-context-background.js ui-context-sidepanel.js; do
            if ! grep -Fxq "$required" <<< "$entries"; then
              echo "$required is missing from ZIP root." >&2
              exit 1
            fi
          done

          for retired in prompt-shortcut-focus.js reds-x-search-core.js reds-x-search-polish.js; do
            if grep -Fxq "$retired" <<< "$entries"; then
              echo "Retired runtime file must not ship: $retired" >&2
              exit 1
            fi
          done

          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          unzip -q "$zip_path" -d "$verify_dir"

          VERIFY_DIR="$verify_dir" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.VERIFY_DIR;
          const manifestPath = path.join(root, 'manifest.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const refs = [
            manifest.background?.service_worker,
            manifest.side_panel?.default_path,
            ...Object.values(manifest.icons || {}),
            ...Object.values(manifest.action?.default_icon || {}),
            ...(manifest.content_scripts || []).flatMap(entry => entry.js || [])
          ].filter(Boolean);
          const missing = [...new Set(refs)].filter(file => !fs.existsSync(path.join(root, file)));
          if (missing.length) {
            console.error('Packaged manifest references missing files:\n' + missing.join('\n'));
            process.exit(1);
          }

          const scripts = (manifest.content_scripts || []).flatMap(entry => entry.js || []);
          const contractIndex = scripts.indexOf('app-contract.js');
          const coreIndex = scripts.indexOf('interaction-core.js');
          const bridgeIndex = scripts.indexOf('interaction-bridge.js');
          const xCoreIndex = scripts.indexOf('x-search-core.js');
          const floatingIndex = scripts.indexOf('content-floating-search.js');
          if (
            contractIndex < 0
            || coreIndex <= contractIndex
            || bridgeIndex <= coreIndex
            || xCoreIndex <= bridgeIndex
            || floatingIndex <= xCoreIndex
          ) {
            console.error('Packaged shared runtime load order is invalid.');
            process.exit(1);
          }

          for (const retired of ['prompt-shortcut-focus.js', 'reds-x-search-core.js', 'reds-x-search-polish.js']) {
            if (scripts.includes(retired) || fs.existsSync(path.join(root, retired))) {
              console.error(`Retired runtime file still ships: ${retired}`);
              process.exit(1);
            }
          }

          const backgroundWrapper = fs.readFileSync(path.join(root, 'background-wrapper.js'), 'utf8');
          for (const required of ['app-contract.js', 'side-panel-presence-background.js', 'ui-context-background.js', 'background.js']) {
            if (!backgroundWrapper.includes(required)) {
              console.error(`Packaged background wrapper is missing ${required}.`);
              process.exit(1);
            }
          }

          const sidepanelWrapper = fs.readFileSync(path.join(root, 'sidepanel-wrapper.js'), 'utf8');
          for (const required of ['app-contract.js', 'x-search-core.js', 'ui-context-sidepanel.js', 'interaction-core.js', 'interaction-bridge.js']) {
            if (!sidepanelWrapper.includes(required)) {
              console.error(`Packaged sidepanel wrapper is missing ${required}.`);
              process.exit(1);
            }
          }

          console.log(`Validated ${new Set(refs).size} packaged manifest references and v1.17 runtime composition.`);
          NODE

          echo 'Packaged runtime contract is valid.'
          printf '%s\n' "$entries" | head -40

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: quicklinksexpansion-v${{ steps.version.outputs.version }}
          path: dist/quicklinksexpansion-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish validated ZIP to repository
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          zip_name="quicklinksexpansion-v${version}.zip"
          mkdir -p release
          cp "dist/${zip_name}" "release/${zip_name}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "release/${zip_name}"
          if git diff --cached --quiet; then
            echo 'Validated ZIP is already current.'
          else
            git commit -m "Publish validated extension ZIP v${version} [skip ci]"
            git push
          fi
